[project]
name = "capability-lab"
version = "0.1.0"
description = "Local-first deterministic capability experiment loop"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
]

[project.scripts]
lab = "capability_lab.cli.main:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "import-linter>=2.1,<3",
  "pip-audit>=2.7,<3",
  "pyright>=1.1.390,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.importlinter]
root_packages = ["capability_lab"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["capability_lab.domain"]
forbidden_modules = [
  "capability_lab.application",
  "capability_lab.ports",
  "capability_lab.adapters",
  "capability_lab.cli",
  "capability_lab.schemas",
  "pydantic",
  "sqlalchemy",
  "typer",
  "rich",
]

[[tool.importlinter.contracts]]
name = "Ports do not depend on adapters or CLI"
type = "forbidden"
source_modules = ["capability_lab.ports"]
forbidden_modules = ["capability_lab.adapters", "capability_lab.cli"]

[[tool.importlinter.contracts]]
name = "Application does not depend on CLI"
type = "forbidden"
source_modules = ["capability_lab.application"]
forbidden_modules = ["capability_lab.cli"]

[[tool.importlinter.contracts]]
name = "CLI does not depend directly on adapters"
type = "forbidden"
source_modules = ["capability_lab.cli"]
forbidden_modules = ["capability_lab.adapters"]
ignore_imports = ["capability_lab.cli.main -> capability_lab.bootstrap"]
